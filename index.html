<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Windows XP Professional</title><style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:sans-serif;font-size:11px;}
body,html{width:100%;height:100%;overflow:hidden;}
#dk{width:100%;height:calc(100% - 30px);position:relative;background:url('https://wikimedia.org') no-repeat center;background-size:cover;}
.ic{width:70px;text-align:center;color:#fff;cursor:pointer;position:absolute;left:20px;text-shadow:1px 1px 1px #000;}
.win{position:absolute;border:3px solid #004EAE;background:#ECE9D8;display:none;flex-direction:column;min-width:230px;box-shadow:2px 2px 10px #0004;z-index:10;border-radius:4px 4px 0 0;}
.hd{background:linear-gradient(#0058e6,#0026a2);padding:4px 8px;color:#fff;font-weight:bold;display:flex;justify-content:space-between;cursor:move;}
.cl{background:red;color:#fff;border:1px solid #fff;cursor:pointer;padding:0 5px;font-weight:bold;}
.bd{flex-grow:1;background:#FFF;padding:2px;position:relative;display:flex;flex-direction:column;}
.mb{background:#ECE9D8;border-bottom:1px solid #D0CCBA;display:flex;gap:12px;padding:2px 6px;position:relative;}
.mi{cursor:pointer;color:#000;}
.dd{position:absolute;top:16px;left:4px;background:#fff;border:1px solid #7F9DB9;display:none;flex-direction:column;z-index:150;box-shadow:2px 2px 5px #0003;}
.di{padding:4px 12px;cursor:pointer;color:#000;} .di:hover{background:#316AC5;color:#fff;}
#tb{width:100%;height:30px;background:linear-gradient(#245edb,#1745b6);position:absolute;bottom:0;display:flex;justify-content:space-between;align-items:center;}
#st{height:100%;width:80px;background:linear-gradient(#4caf50,#1b5e20);border:none;color:#fff;font-style:italic;font-weight:bold;font-size:14px;cursor:pointer;}
#ck{color:#fff;padding:0 10px;font-weight:bold;}
.fe-l{padding:6px;cursor:pointer;border-bottom:1px solid #eee;color:#000;} .fe-l:hover{background:#316AC5;color:#fff;}
.ie-bar{background:#ECE9D8;padding:4px;display:flex;gap:5px;border-bottom:1px solid #999;}
.ie-in{flex-grow:1;padding:2px;border:1px solid #7F9DB9;outline:none;}
.ie-res{padding:12px;overflow-y:auto;height:100%;color:#222;}
.ie-res h2{color:#002060;font-size:15px;margin-bottom:4px;}
.res-item{margin-top:12px;}
.res-item a{color:#0000cc;font-size:13px;font-weight:bold;text-decoration:underline;display:block;}
.res-item span{color:green;font-size:11px;}
.res-item p{margin-top:2px;color:#444;}
</style></head><body>
<div id="dk" onclick="document.getElementById('f-dd').style.display='none'">
    <div class="ic" style="top:20px;" onclick="oW('w-pb')"><img src="https://flaticon.com" width=32><br>Pinball</div>
    <div class="ic" style="top:100px;" onclick="oW('w-np')"><img src="https://flaticon.com" width=32><br>Notepad</div>
    <div class="ic" style="top:180px;" onclick="oW('w-fe');rFE();"><img src="https://flaticon.com" width=32><br>Explorer</div>
    <div class="ic" style="top:260px;" onclick="oW('w-ie')"><img src="https://flaticon.com" width=32><br>Internet Explorer</div>
    <div id="w-np" class="win" style="width:320px;height:240px;top:100px;left:50px;">
        <div class="hd" onmousedown="dg(event,'w-np')"><span id="np-t">Untitled</span><button class="cl" onclick="cW('w-np')">X</button></div>
        <div class="mb"><span class="mi" onclick="event.stopPropagation();let d=document.getElementById('f-dd');d.style.display=(d.style.display==='flex')?'none':'flex';">File</span><div id="f-dd" class="dd"><div class="di" onclick="fN()">New</div><div class="di" onclick="fS()">Save</div></div></div>
        <div class="bd"><textarea id="np-tx" style="width:100%;height:100%;border:none;resize:none;outline:none;font-family:monospace;padding:4px;user-select:text;"></textarea></div>
    </div>
    <div id="w-fe" class="win" style="width:300px;height:250px;top:120px;left:100px;">
        <div class="hd" onmousedown="dg(event,'w-fe')"><span>File Explorer</span><button class="cl" onclick="cW('w-fe')">X</button></div>
        <div class="bd" id="fe-bd" style="overflow-y:auto;background:#fff;"></div>
    </div>
    <div id="w-ie" class="win" style="width:460px;height:350px;top:60px;left:200px;">
        <div class="hd" onmousedown="dg(event,'w-ie')"><span>Internet Explorer</span><button class="cl" onclick="cW('w-ie')">X</button></div>
        <div class="ie-bar"><input type="text" id="ie-url" class="ie-in" value="Search topics using Bing..." onfocus="if(this.value.includes('Search'))this.value=''" onkeydown="if(event.key==='Enter')sIE()"><button onclick="sIE()" style="padding:0 6px;">Go</button></div>
        <div class="bd" id="ie-bd" style="background:#fff;overflow-y:auto;"><div class="ie-res"><h2>Bing Live Emulation App</h2><p>Type keywords into the search bar above and press enter to dynamically generate custom search results.</p></div></div>
    </div>
    <div id="w-pb" class="win" style="width:340px;height:450px;top:40px;left:450px;">
        <div class="hd" onmousedown="dg(event,'w-pb')"><span>Pinball (Mega Score)</span><button class="cl" onclick="cW('w-pb');lp=false;">X</button></div>
        <div class="bd" style="background:#000;"><canvas id="cv" width="320" height="400"></canvas></div>
    </div>
</div>
<div id="tb"><button id="st">start</button><div id="ck">12:00 PM</div></div>
<script>
let ac=null,ox,oy,lp=false,sc=0,cF=null,ks={},fl=0.3,fr=-0.3,b={x:290,y:250,vx:-2,vy:-5};const c=document.getElementById('cv'),cx=c.getContext('2d');
function oW(i){let w=document.getElementById(i);w.style.display='flex';document.querySelectorAll('.win').forEach(x=>x.style.zIndex=10);w.style.zIndex=99;if(i==='w-pb'&&!lp){lp=true;b={x:290,y:250,vx:-2,vy:-5};tk();}}
function cW(i){document.getElementById(i).style.display='none';}
function dg(e,i){if(e.target.tagName==='Volvo'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;ac=document.getElementById(i);ox=e.clientX-ac.offsetLeft;oy=e.clientY-ac.offsetTop;document.querySelectorAll('.win').forEach(x=>x.style.zIndex=10);ac.style.zIndex=99;const mv=m=>{if(ac){ac.style.left=(m.clientX-ox)+'px';ac.style.top=(m.clientY-oy)+'px';}};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);}
function fN(){document.getElementById('np-tx').value="";cF=null;document.getElementById('np-t').innerText="Untitled";}
function fS(){let n=cF||prompt("Name:","notes.txt");if(!n)return;let db=JSON.parse(localStorage.getItem('xp_f')||'{}');db[n]=document.getElementById('np-tx').value;localStorage.setItem('xp_f',JSON.stringify(db));cF=n;document.getElementById('np-t').innerText=n;rFE();}
function rFE(){let bd=document.getElementById('fe-bd');bd.innerHTML='';let db=JSON.parse(localStorage.getItem('xp_f')||'{}'),k=Object.keys(db);if(!k.length){bd.innerHTML='<div style="color:gray;padding:8px;">No files saved.</div>';return;}k.forEach(f=>{let d=document.createElement('div');d.className='fe-l';d.innerText="📄 "+f;d.onclick=()=>{oW('w-np');document.getElementById('np-tx').value=db[f];cF=f;document.getElementById('np-t').innerText=f;};bd.appendChild(d);});}
function sIE(){let q=document.getElementById('ie-url').value;if(!q||q.includes('Search'))return;document.getElementById('ie-bd').innerHTML=`<div class="ie-res"><h2>Bing Results for: ${q}</h2><p style="color:#666;margin-bottom:12px;">About 1,240,000 matches analyzed (0.08 seconds)</p><div class="res-item"><a href="#">Top Search Reference for ${q}</a><span>https://bing.com{q}</span><p>Explore instant database matching layouts, resources, and answers built dynamically for "${q}".</p></div><div class="res-item"><a href="#">Wikipedia Content Page: ${q}</a><span>https://wikipedia.org{q}</span><p>Detailed history, context information, structures, and definitions discussing modern variants of ${q}.</p></div></div>`;}
window.addEventListener('keydown',e=>{if(e.key==='z')ks.l=true;if(e.key==='/')ks.r=true;});window.addEventListener('keyup',e=>{if(e.key==='z')ks.l=false;if(e.key==='/')ks.r=false;});
function tk(){if(!lp)return;fl=ks.l?Math.max(-0.4,fl-0.15):Math.min(0.3,fl+0.08);fr=ks.r?Math.min(0.4,fr+0.15):Math.max(-0.3,fr-0.1);b.vy+=0.09;b.x+=b.vx;b.y+=b.vy;if(b.x<15||b.x>305)b.vx*=-0.8;if(b.y<15)b.vy*=-0.8;let d1=Math.hypot(b.x-100,b.y-100),d2=Math.hypot(b.x-220,b.y-100);if(d1<28){b.vx=(b.x-100)/d1*8;b.vy=(b.y-100)/d1*8;sc+=100000;}if(d2<28){b.vx=(b.x-220)/d2*8;b.vy=(b.y-220)/d2*8;sc+=100000;}
if(b.x<110&&b.y>330){let eY=330+(b.x-10)*0.4;if(b.y>eY-10){b.y=eY-10;b.vy=-Math.abs(b.vy)*0.6;b.vx=Math.abs(b.vx)*0.8+0.5;}}if(b.x>210&&b.y>330){let eY=330+(310-b.x)*0.4;if(b.y>eY-10){b.y=eY-10;b.vy=-Math.abs(b.vy)*0.6;b.vx=-Math.abs(b.vx)*0.8-0.5;}}
if(b.y>345&&b.y<375){if(b.x>=100&&b.x<=155&&(ks.l||b.vy>0)){b.vy=-8.5;b.vx+=0.5;}if(b.x>=165&&b.x<=220&&(ks.r||b.vy>0)){b.vy=-8.5;b.vx-=0.5;}}if(b.y>400){b.x=290;b.y=250;b.vx=-2;b.vy=-5;}
cx.clearRect(0,0,320,400);cx.strokeStyle='#0af';cx.lineWidth=2;cx.strokeRect(10,10,300,380);cx.fillStyle='red';cx.beginPath();cx.arc(100,100,18,0,7);cx.arc(220,100,18,0,7);cx.fill();cx.strokeStyle='#0af';cx.lineWidth=3;cx.beginPath();cx.moveTo(10,330);cx.lineTo(100,366);cx.stroke();cx.beginPath();cx.moveTo(310,330);cx.lineTo(220,366);cx.stroke();cx.save();cx.translate(100,366);cx.rotate(fl);cx.fillStyle='#fff';cx.fillRect(0,-4,55,8);cx.restore();cx.save();cx.translate(220,366);cx.rotate(fr);cx.fillStyle='#fff';cx.fillRect(-55,-4,55,8);cx.restore();cx.fillStyle='#fff';cx.beginPath();cx.arc(b.x,b.y,8,0,7);cx.fill();cx.fillStyle='#0f0';cx.font='14px monospace';cx.fillText("SCORE: "+sc.toLocaleString(),20,30);requestAnimationFrame(tk);}
setInterval(()=>{let d=new Date();document.getElementById('ck').innerText=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});},1000);
</script></body></html>
